<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridFlow EV Station Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="detail-page-shell">
      <a class="back-link" href="dashboard.html" aria-label="대시보드로 돌아가기">
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
      </a>

      <section class="detail-hero" id="station-hero"></section>

      <section class="detail-page-grid">
        <section class="panel">
          <div class="panel-title">
            <div>
              <p class="eyebrow">충전소 현황</p>
              <h3>충전소 운영 정보</h3>
            </div>
          </div>
          <div id="station-detail-page"></div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <div>
              <p class="eyebrow">운영 안내</p>
              <h3>추천 운영</h3>
            </div>
          </div>
          <div id="station-policy-page"></div>
        </section>
      </section>
    </main>

    <script src="station-detail.js"></script>
  </body>
</html>
