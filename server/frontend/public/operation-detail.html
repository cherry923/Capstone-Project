<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridFlow EV Operation Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=legend-swatch-20260604" />
  </head>
  <body class="detail-page operation-detail-page">
    <main class="detail-page-shell">
      <a class="back-link" href="dashboard.html" aria-label="대시보드로 돌아가기">
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
      </a>

      <section class="detail-hero operation-hero">
        <div>
          <p class="eyebrow">운영 정책 상세</p>
          <h1>운영 비교 상세</h1>
          <p>
            운영 방식별 절감률과 Grid 사용량, 충전소별 수요 패턴을 비교합니다.
          </p>
        </div>
        <div class="operation-hero-actions">
          <label class="operation-date-control operation-hero-date-control">
            <span>표시 날짜</span>
            <select id="operation-date-select" aria-label="운영 비교 날짜 선택"></select>
          </label>
          <a class="detail-action-link" id="operation-forecast-detail-link" href="forecast-detail.html?date=2022-02-27">예측 모델 보기</a>
        </div>
      </section>

      <section class="operation-detail-stack">
        <section class="panel operation-result-panel">
          <div class="panel-title compact">
              <div>
                <p class="eyebrow">Decision Model Comparison</p>
                <h3>태양광 사용 기본 운영 대비 전기요금 절감률</h3>
              </div>
          </div>
          <div class="operation-result-bars" id="operation-result-bars"></div>
        </section>

        <section class="operation-chart-grid">
          <article class="panel operation-chart-panel">
            <div class="panel-title compact">
              <div>
                <p class="eyebrow">PV Forecast</p>
                <h3>시간대별 PV 실제·예측 발전량</h3>
              </div>
              <span class="forecast-chip" id="operation-date-chip">2022-02-27</span>
            </div>
            <div id="operation-pv-chart"></div>
          </article>

          <article class="panel operation-chart-panel">
            <div class="panel-title compact">
              <div>
                <p class="eyebrow">Grid Usage</p>
                <h3>운영 기준별 24시간 Grid 사용량</h3>
              </div>
              <span class="forecast-chip">kWh</span>
            </div>
            <div id="operation-grid-chart"></div>
          </article>

          <article class="panel operation-chart-panel operation-chart-panel-wide">
            <div class="panel-title compact">
              <div>
                <p class="eyebrow">Station EV Demand</p>
                <h3>충전소별 EV 실제·예측 수요</h3>
              </div>
              <span class="forecast-chip">실선 실제 · 점선 예측</span>
            </div>
            <div id="operation-station-demand-chart"></div>
          </article>
        </section>

        <section class="panel operation-model-panel">
          <div class="panel-title compact">
            <div>
              <p class="eyebrow">Forecast Model</p>
              <h3>예측모델 성능과 충전소별 일 합계</h3>
            </div>
          </div>
          <div class="operation-model-grid">
            <div class="operation-forecast-metrics" id="operation-forecast-metrics"></div>
            <div class="operation-station-breakdown" id="operation-station-breakdown"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="auth.js"></script>
    <script src="assets/operation-comparison/evonly_vmoderate_v2p90_pvess_multiseed.js?v=actual-grid-trace-20260604"></script>
    <script src="operation-detail.js?v=actual-grid-trace-20260604"></script>
  </body>
</html>
