spring:
  datasource:
    url: jdbc:h2:mem:multi_ev_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

external:
  weather:
    asos:
      base-url: http://localhost:0
      service-key: test-key

  ai:
    base-url: http://localhost:8000
    dispatch:
      demo-open-enabled: false
